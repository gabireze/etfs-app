<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Simulador de Carteira de ETFs Brasil | Análise de Rentabilidade 3 Meses</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Inline Critical Styles for FOUC Prevention -->
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f7f9fc;
      color: #1a202c;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #0f172a;
        color: #e2e8f0;
      }
    }
    /* Loading skeleton */
    .app-loading {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      flex-direction: column;
      gap: 1rem;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(16, 185, 129, 0.2);
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- SEO Meta Tags -->
  <meta name="description" content="Simulador gratuito de carteira de ETFs brasileiros. Compare rentabilidade de 28+ ETFs da B3 vs SELIC e IPCA. Análise de performance dos últimos 3 meses com gráficos interativos.">
  <meta name="keywords" content="ETFs Brasil, simulador carteira ETFs, BOVA11, IVVB11, rentabilidade ETF, análise fundamentalista, comparar ETFs, SELIC, IPCA, B3, investimentos">
  <meta name="author" content="ETFs Brasil">
  <meta name="robots" content="index, follow">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://etfs-brasil.app/">
  <meta property="og:title" content="Simulador de Carteira de ETFs Brasil | Análise de Rentabilidade">
  <meta property="og:description" content="Compare a performance de 28+ ETFs brasileiros (ações, internacional, dividendos, cripto) vs benchmarks econômicos. Simulador gratuito com dados em tempo real.">
  <meta property="og:image" content="https://etfs-brasil.app/og-image.png">
  <meta property="og:locale" content="pt_BR">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://etfs-brasil.app/">
  <meta property="twitter:title" content="Simulador de Carteira de ETFs Brasil">
  <meta property="twitter:description" content="Compare rentabilidade de ETFs brasileiros vs SELIC e IPCA. Análise dos últimos 3 meses com gráficos interativos.">
  <meta property="twitter:image" content="https://etfs-brasil.app/twitter-image.png">

  <!-- Canonical URL -->
  <link rel="canonical" href="https://etfs-brasil.app/">

  <!-- Theme Color -->
  <meta name="theme-color" content="#10b981">
  <meta name="msapplication-TileColor" content="#10b981">

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Simulador de Carteira de ETFs Brasil",
    "description": "Ferramenta gratuita para simular e comparar carteiras de ETFs brasileiros com benchmarks econômicos",
    "url": "https://etfs-brasil.app/",
    "applicationCategory": "FinanceApplication",
    "operatingSystem": "Web",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "BRL"
    },
    "featureList": [
      "Análise de 28+ ETFs da B3",
      "Comparação com SELIC e IPCA",
      "Gráficos interativos de performance",
      "Simulação de carteiras personalizadas",
      "Dados históricos dos últimos 3 meses"
    ]
  }
  </script>
</head>
<body>
  <app-root>
    <!-- Loading skeleton (mostrado enquanto Angular carrega) -->
    <div class="app-loading">
      <div class="spinner"></div>
      <p style="opacity: 0.7; font-size: 14px;">Carregando simulador...</p>
    </div>
  </app-root>
</body>
</html>
